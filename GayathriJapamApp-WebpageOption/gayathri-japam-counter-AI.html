<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gayathri Japam Counter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(rgba(255, 248, 240, 0.75), rgba(255, 230, 204, 0.85)), 
                  url('images-krishna-1.jfif') center/cover no-repeat fixed;
      padding: 20px;
    }
    
    .card {
      background: rgba(255, 253, 248, 0.96);
      border: 4px solid #FF9933;
      border-radius: 28px;
      box-shadow: 0 12px 36px rgba(204, 85, 0, 0.3);
      width: 100%;
      max-width: 460px;
      padding: 32px 24px;
      text-align: center;
      position: relative;
      backdrop-filter: blur(4px);
    }
    
    h1 { color: #CC5500; font-size: 30px; margin-bottom: 6px; }
    .sub { color: #8B4513; font-size: 16px; margin-bottom: 16px; font-weight: 700; }
    
    .timer {
      display: inline-block;
      background: #FFE6CC;
      color: #CC5500;
      font-weight: bold;
      font-size: 22px;
      padding: 8px 22px;
      border-radius: 24px;
      border: 2px solid #FF9933;
      margin-bottom: 18px;
    }
    
    .counter-box {
      background: linear-gradient(135deg, #FF9933 0%, #FF8000 100%);
      color: #FFFFFF;
      border-radius: 22px;
      padding: 32px 14px;
      margin-bottom: 18px;
      box-shadow: 0 8px 20px rgba(204, 85, 0, 0.35);
    }
    
    .count-val { font-size: 84px; font-weight: 900; line-height: 1; }
    .target-val { font-size: 18px; margin-top: 12px; opacity: 0.95; font-weight: 600; }
    
    .progress-bg { background: #FFE6CC; height: 14px; border-radius: 7px; overflow: hidden; margin-bottom: 20px; }
    .progress-fill { background: #CC5500; height: 100%; width: 0%; transition: width 0.2s; }
    
    .btn-main {
      background: #FF9933; color: white; border: none; width: 100%;
      padding: 22px; font-size: 26px; font-weight: bold; border-radius: 18px;
      cursor: pointer; box-shadow: 0 8px 16px rgba(255, 153, 51, 0.45); margin-bottom: 12px;
      transition: transform 0.1s;
    }
    .btn-main:active { transform: scale(0.97); background: #E67E00; }

    .btn-mic {
      background: #28a745; color: white; border: none; width: 100%;
      padding: 14px; font-size: 18px; font-weight: bold; border-radius: 14px;
      cursor: pointer; box-shadow: 0 6px 14px rgba(40, 167, 69, 0.3); margin-bottom: 12px;
    }
    .btn-mic.listening { background: #dc3545; box-shadow: 0 6px 14px rgba(220, 53, 69, 0.4); }
    
    .row { display: flex; gap: 10px; margin-bottom: 10px; }
    .btn-sub {
      flex: 1; padding: 14px; border: 2px solid #FF9933; background: white;
      color: #CC5500; font-weight: bold; border-radius: 14px; cursor: pointer; font-size: 15px;
    }
    .btn-sub:active { background: #FFE6CC; }

    .mic-level-container {
      width: 100%; background: #e0e0e0; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 8px;
    }
    .mic-level-bar { height: 100%; width: 0%; background: #28a745; transition: width 0.05s; }

    .speech-status { font-size: 13px; color: #8B4513; margin-bottom: 10px; font-weight: 600; min-height: 18px; }

    .sensitivity-box {
      margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #8B4513; font-weight: bold;
    }

    .overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75); z-index: 1000; align-items: center; justify-content: center; padding: 16px;
    }
    .overlay.active { display: flex; }
    
    .overlay-card {
      background: #FFFDF8; border: 4px solid #FF9933; border-radius: 24px;
      padding: 20px; text-align: center; max-width: 420px; width: 100%;
      max-height: 90vh; display: flex; flex-direction: column; align-items: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }
    
    .end-img {
      width: 100%; max-height: 50vh; border-radius: 16px; object-fit: contain; margin-bottom: 14px; border: 2px solid #FF9933; background-color: #000;
    }
  </style>
</head>
<body>

  <audio id="shankhAudio" src="shankh.mp3" preload="auto"></audio>

  <div class="card">
    <h1>ॐ Gayathri Japam</h1>
    <div class="sub" id="subTitle">1008 Sacred Chants Counter</div>
    <div class="timer" id="timerDisplay">⏱️ 00:00:00</div>

    <div class="counter-box">
      <div class="count-val" id="countDisplay">0</div>
      <div class="target-val">Target: <span id="targetDisplay">1008</span></div>
    </div>

    <div class="progress-bg">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <button class="btn-main" onclick="increment()">COUNT (TAP)</button>
    <button class="btn-mic" id="micBtn" onclick="toggleAudioCounter()">🎙️ Start Audio Auto-Count</button>

    <div class="mic-level-container">
      <div class="mic-level-bar" id="micLevelBar"></div>
    </div>
    
    <div class="sensitivity-box">
      <label for="threshold">Voice Sensitivity Trigger:</label>
      <input type="range" id="threshold" min="2" max="30" value="6">
    </div>
    
    <div class="speech-status" id="speechStatus">Mic status: Disabled</div>

    <div class="row">
      <button class="btn-sub" id="pauseBtn" onclick="togglePause()">⏸️ Pause</button>
      <button class="btn-sub" onclick="toggleTarget()">🎯 Target: <span id="targetBtnLabel">1008</span></button>
      <button class="btn-sub" onclick="resetApp()">🔄 Reset</button>
    </div>
  </div>

  <div class="overlay" id="endOverlay">
    <div class="overlay-card">
      <img src="images-krishna-3.jfif" class="end-img" alt="Krishna Viswaroopam" />
      <h2 style="color: #CC5500; margin-bottom: 6px; font-size: 24px;">Japam Completed!</h2>
      <p style="color: #8B4513; margin-bottom: 16px; font-weight:700; font-size: 18px;" id="finalTimeText">Total Time: 00:00:00</p>
      <button class="btn-main" onclick="resetApp()">Start New Japam</button>
    </div>
  </div>

  <script>
    let count = parseInt(localStorage.getItem('japam_count')) || 0;
    let target = parseInt(localStorage.getItem('japam_target')) || 1008;
    let secondsElapsed = parseInt(localStorage.getItem('japam_seconds')) || 0;
    let isCompleted = localStorage.getItem('japam_completed') === 'true';
    let isPaused = localStorage.getItem('japam_paused') === 'true';
    let timerInterval = null;
    
    let audioContext = null;
    let analyser = null;
    let microphoneStream = null;
    let isAudioActive = false;
    let wakeLock = null;
    let recognition = null;

    let isChanting = false;
    let chantStartTime = 0;
    let lastIncrementTime = 0;

    const keywords = ["om", "bhur", "bhuva", "swaha", "tat", "savitur", "varenyam", "bhargo", "devasya", "dhimahi", "dhiyo", "yonah", "prachodayat"];

    function saveState() {
      localStorage.setItem('japam_count', count);
      localStorage.setItem('japam_target', target);
      localStorage.setItem('japam_seconds', secondsElapsed);
      localStorage.setItem('japam_completed', isCompleted);
      localStorage.setItem('japam_paused', isPaused);
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    function playSynthConch() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      const now = audioCtx.currentTime;
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(330, now + 1.2);
      osc.frequency.exponentialRampToValueAtTime(310, now + 3.5);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.8, now + 0.8);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 4.0);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 4.0);
    }

    function playSound() {
      const audioElem = document.getElementById('shankhAudio');
      if (audioElem) {
        audioElem.play().catch(err => { playSynthConch(); });
      } else {
        playSynthConch();
      }
    }

    function updateUI() {
      document.getElementById('countDisplay').innerText = count;
      document.getElementById('targetDisplay').innerText = target;
      document.getElementById('targetBtnLabel').innerText = target;
      document.getElementById('subTitle').innerText = `${target} Sacred Chants Counter`;
      document.getElementById('progressFill').style.width = `${(count / target) * 100}%`;
      
      const hrs = String(Math.floor(secondsElapsed / 3600)).padStart(2, '0');
      const mins = String(Math.floor((secondsElapsed % 3600) / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('timerDisplay').innerText = `⏱️ ${hrs}:${mins}:${secs}`;
      document.getElementById('pauseBtn').innerText = isPaused ? '▶️ Resume' : '⏸️ Pause';

      if (isCompleted) {
        document.getElementById('finalTimeText').innerText = `Total Time: ${hrs}:${mins}:${secs}`;
        document.getElementById('endOverlay').classList.add('active');
        stopAudioCounter();
      } else {
        document.getElementById('endOverlay').classList.remove('active');
      }
    }

    function startTimer() {
      if (!timerInterval && !isCompleted && !isPaused) {
        timerInterval = setInterval(() => {
          secondsElapsed++;
          saveState();
          updateUI();
        }, 1000);
      }
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function togglePause() {
      if (isCompleted || count === 0) return;
      isPaused = !isPaused;
      if (isPaused) {
        stopTimer();
      } else {
        startTimer();
      }
      saveState();
      updateUI();
    }

    function increment() {
      if (isCompleted) return;
      if (isPaused) {
        isPaused = false;
      }
      if (count === 0 || !timerInterval) {
        startTimer();
      }

      count++;
      if (count >= target) {
        count = target;
        isCompleted = true;
        stopTimer();
        playSound();
      }
      saveState();
      updateUI();
    }

    async function toggleAudioCounter() {
      if (isAudioActive) {
        stopAudioCounter();
      } else {
        await startAudioCounter();
      }
    }

    // Hybrid Web Audio & Speech Recognition Engine
    async function startAudioCounter() {
      try {
        microphoneStream = await navigator.mediaDevices.getUserMedia({ 
          audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: true } 
        });
        
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        analyser = audioContext.createAnalyser();
        const source = audioContext.createMediaStreamSource(microphoneStream);
        
        // Voice pitch bandpass filter (100Hz - 1000Hz)
        const filter = audioContext.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 550;
        filter.Q.value = 0.9;

        source.connect(filter);
        filter.connect(analyser);

        analyser.fftSize = 256;
        isAudioActive = true;
        
        requestWakeLock();
        initSpeechRecognition();

        document.getElementById('micBtn').classList.add('listening');
        document.getElementById('micBtn').innerText = "🛑 Stop Listening";
        document.getElementById('speechStatus').innerText = "Listening... Start chanting.";
        
        processAudio();
      } catch (err) {
        console.error("Mic Access Error:", err);
        document.getElementById('speechStatus').innerText = "Microphone access blocked.";
      }
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) {
            transcript = event.results[i][0].transcript.toLowerCase();
            const matched = keywords.some(word => transcript.includes(word));
            const now = Date.now();
            if (matched && (now - lastIncrementTime > 2000)) {
              increment();
              lastIncrementTime = now;
              document.getElementById('speechStatus').innerText = `Chant Recognized! (${count}/${target})`;
            }
          }
        }
      };

      recognition.onend = () => {
        if (isAudioActive && !isCompleted && !isPaused) {
          try { recognition.start(); } catch(e) {}
        }
      };

      try { recognition.start(); } catch(e) {}
    }

    function processAudio() {
      if (!isAudioActive) return;

      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);

      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        sum += dataArray[i];
      }
      let voiceEnergy = sum / dataArray.length;

      // Update Visual Meter Bar
      document.getElementById('micLevelBar').style.width = Math.min(100, voiceEnergy * 5) + '%';

      const userThreshold = parseInt(document.getElementById('threshold').value);
      const now = Date.now();

      if (voiceEnergy > userThreshold) {
        if (!isChanting) {
          isChanting = true;
          chantStartTime = now;
        }
      } else {
        if (isChanting) {
          const chantDuration = now - chantStartTime;
          // Chant length validation: 1.5s voice activity with 2s interval limit
          if (chantDuration > 1500 && (now - lastIncrementTime > 2000)) {
            increment();
            lastIncrementTime = now;
            document.getElementById('speechStatus').innerText = `Chant Detected! (${count}/${target})`;
          }
          isChanting = false;
        }
      }

      requestAnimationFrame(processAudio);
    }

    function stopAudioCounter() {
      isAudioActive = false;
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
        recognition = null;
      }
      if (microphoneStream) {
        microphoneStream.getTracks().forEach(track => track.stop());
        microphoneStream = null;
      }
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }
      releaseWakeLock();
      document.getElementById('micLevelBar').style.width = '0%';
      document.getElementById('micBtn').classList.remove('listening');
      document.getElementById('micBtn').innerText = "🎙️ Start Audio Auto-Count";
      document.getElementById('speechStatus').innerText = "Mic status: Stopped";
    }

    function toggleTarget() {
      target = target === 1008 ? 108 : 1008;
      if (count >= target) {
        count = target;
        isCompleted = true;
        stopTimer();
        playSound();
      }
      saveState();
      updateUI();
    }

    function resetApp() {
      count = 0;
      secondsElapsed = 0;
      isCompleted = false;
      isPaused = false;
      stopAudioCounter();
      stopTimer();
      localStorage.clear();
      saveState();
      updateUI();
    }

    updateUI();
    if (count > 0 && !isCompleted && !isPaused) startTimer();
  </script>
</body>
</html>
